<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--ink:#14232B;--mute:#5B6B73;--line:#E1E8EA;--bg:#F4F7F7;--card:#fff;--r:16px;
--brand:#0F4C5C;--brand2:#0B3945;--tint:#E3F1EF;--cta:#FFB703;--cta2:#F5A700;--ctaText:#2A1D00;--ring:rgba(15,76,92,.14);
--g1:#0B3945;--g2:#0F4C5C;--g3:#176B73;--glow:rgba(255,183,3,.30);--hsub:#CFE6E3}
body[data-store="amazon"]{--brand:#232F3E;--brand2:#131921;--tint:#E8EDF3;--cta:#FF9900;--cta2:#E88A00;--ctaText:#131921;--ring:rgba(35,47,62,.16);--g1:#131921;--g2:#232F3E;--g3:#37475A;--glow:rgba(255,153,0,.38);--hsub:#D5DBE3}
body[data-store="meesho"]{--brand:#9F2089;--brand2:#7D1A6C;--tint:#F9E6F5;--cta:#D61F78;--cta2:#B91A66;--ctaText:#fff;--ring:rgba(159,32,137,.16);--g1:#570D48;--g2:#9F2089;--g3:#C2349F;--glow:rgba(244,51,151,.40);--hsub:#F6D9EF}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.logo{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif}
.hide{display:none!important}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);padding:12px max(20px,calc((100% - 1120px)/2));display:flex;align-items:center;gap:20px}
.logo{font-size:24px;font-weight:800;letter-spacing:-.03em;color:var(--brand)}
.logo span{color:var(--cta2)}
.sbar{display:flex;align-items:center;flex:1;max-width:460px;margin-left:auto;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:3px 3px 3px 16px;transition:border-color .15s,box-shadow .15s}
.sbar:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px var(--ring)}
.sbar input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:15px;color:var(--ink);padding:8px 4px;outline:none}
.sbtn{display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:50%;background:var(--brand);cursor:pointer;flex:none}
.sbtn:hover{background:var(--brand2)}
.sbtn svg{stroke:#fff}
.badge{height:44px;width:auto;flex:none;border-radius:8px}
.sub{display:flex;gap:4px;margin:0;padding:0}
.sub button{background:none;border:0;border-radius:999px;font:inherit;font-size:14px;font-weight:600;color:var(--mute);padding:8px 16px;cursor:pointer}
.sub button:hover{background:var(--tint);color:var(--brand)}
.sub button.on{background:var(--tint);color:var(--brand)}

/* layout */
main{max-width:1160px;margin:0 auto;padding:0 20px 56px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-bottom:20px}
.empty{text-align:center;color:var(--mute);padding:48px 16px}

/* hero */
.hero{margin:16px 0 22px;padding:26px 30px 22px;border-radius:20px;color:#fff;background:radial-gradient(900px 340px at 85% -10%,var(--glow),transparent 60%),linear-gradient(135deg,var(--g1) 0%,var(--g2) 55%,var(--g3) 100%);overflow:hidden}
.hero h1{margin:0 0 4px;font-size:clamp(24px,3.2vw,34px);line-height:1.1;font-weight:800;letter-spacing:-.03em}
.hero p{margin:0 0 14px;font-size:15px;max-width:52ch;color:var(--hsub)}
.pills{display:flex;flex-wrap:wrap;gap:8px;flex:1}
.ctl{display:flex;align-items:center;gap:8px 12px;margin-top:8px}
.gl{flex:none;width:50px;font-size:12.5px;font-weight:700;color:var(--hsub)}
.chip.st-amazon{background:#FFF1D6;color:#8A4B00}
.chip.st-meesho{background:#FBE3F4;color:#7A1A66}
.pill{border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:13.5px;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.pill:hover{background:rgba(255,255,255,.18)}
.pill.on{background:#fff;color:var(--brand);border-color:#fff}
.pill:focus-visible,.btn:focus-visible,.sub button:focus-visible,.sbtn:focus-visible{outline:3px solid var(--cta);outline-offset:2px}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:26px 22px}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 1px 2px rgba(20,35,43,.06),0 0 0 1px var(--line);transition:box-shadow .25s,transform .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(20,35,43,.16),0 0 0 1px #CBD9DC}
.imglink{display:block;position:relative;overflow:hidden;aspect-ratio:4/5;background:linear-gradient(160deg,var(--tint),#fff 70%)}
.imglink img{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);object-fit:contain;display:block;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card[data-t="dress"] .imglink img{inset:0;width:100%;height:100%;object-fit:cover}
.card:hover .imglink img{transform:scale(1.05)}
.imglink .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-size:64px;font-weight:800;color:var(--brand);opacity:.35}
.tag{position:absolute;top:12px;left:12px;z-index:1;font-size:12px;font-weight:800;letter-spacing:.01em;padding:5px 11px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.tag.st-amazon{background:#FF9900;color:#131921}
.tag.st-meesho{background:#D61F78;color:#fff}
.body{display:flex;flex-direction:column;flex:1;padding:14px 16px 16px;min-width:0}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:0 0 6px}
.price{font-family:"Bricolage Grotesque","Figtree",sans-serif;font-weight:800;font-size:17px;letter-spacing:-.01em;color:var(--brand)}
.chip{background:var(--tint);color:var(--brand);font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.card h3{margin:0 0 6px;font-size:16px;line-height:1.35;font-weight:700;letter-spacing:-.005em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{color:var(--brand)}
.dom{font-size:12.5px;color:var(--mute);margin:0 0 8px}
#list .dom{display:none}
.code{font-size:12px;color:var(--mute);margin:0 0 12px}
.code b{color:var(--ink)}
.card p{margin:0 0 8px;font-size:13.5px;color:var(--mute);white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card p:empty{display:none}
.card .btn{margin-top:auto;width:100%}
.card[data-st="amazon"] .btn{background:#FF9900;color:#131921}
.card[data-st="amazon"] .btn:hover{background:#E88A00}
.card[data-st="meesho"] .btn{background:#D61F78;color:#fff}
.card[data-st="meesho"] .btn:hover{background:#B91A66}

/* section styles */
.new{position:absolute;top:12px;right:12px;z-index:1;background:#fff;color:var(--brand);font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.quick{position:absolute;left:12px;right:12px;bottom:12px;z-index:1;text-align:center;font-weight:800;font-size:13.5px;padding:10px;border-radius:12px;background:rgba(255,255,255,.94);color:var(--ink);transform:translateY(150%);transition:transform .3s cubic-bezier(.2,.7,.2,1)}
@media(hover:hover){.card:hover .quick{transform:none}}
@media(hover:none){.quick{display:none}}
/* gifts: ribbon top, dotted wrapping-paper photo area, price tag */
.card[data-t="gift"]::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--cta);z-index:2}
.card[data-t="gift"] .imglink{background:radial-gradient(circle at 1px 1px,rgba(15,76,92,.14) 1.2px,transparent 1.5px) 0 0/14px 14px,linear-gradient(160deg,var(--tint),#fff 75%)}
.card[data-t="gift"] .price{display:inline-flex;align-items:center;gap:6px;background:var(--tint);padding:4px 14px 4px 18px;font-size:15px;clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%)}
.card[data-t="gift"] .price::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
/* dresses: editorial lookbook, tall photo, no box */
.card[data-t="dress"]{background:transparent;box-shadow:none;border-radius:0;overflow:visible}
.card[data-t="dress"]:hover{transform:none;box-shadow:none}
.card[data-t="dress"] .imglink{aspect-ratio:3/4;border-radius:22px;background:var(--tint);transition:box-shadow .3s,transform .3s}
.card[data-t="dress"]:hover .imglink{box-shadow:0 20px 40px rgba(20,35,43,.22);transform:translateY(-4px)}
.card[data-t="dress"] .body{padding:14px 2px 0}
.card[data-t="dress"] h3{font-size:17px}
.card[data-t="dress"] .price{font-size:16px}
/* results bar */
.rbar{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin:0 0 18px}
.rbar .sortw{display:inline;margin:0;font-size:13.5px;font-weight:600;color:var(--mute)}
#sort{font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);cursor:pointer}
#sort:focus-visible{outline:3px solid var(--cta);outline-offset:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--cta);border:0;border-radius:999px;padding:11px 22px;font:inherit;font-size:14.5px;font-weight:700;color:var(--ctaText);cursor:pointer;text-decoration:none;text-align:center;transition:background .15s}
.btn:hover{background:var(--cta2)}
.btn.alt{background:#fff;color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.alt:hover{background:var(--tint)}
.acts{display:flex;gap:18px;padding-top:12px}
.acts .del{padding:0}
.edt{background:none;border:0;color:var(--brand);font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:0}
.edt:hover{text-decoration:underline}
#formTitle small{font-size:13px;font-weight:600;color:var(--mute);margin-left:8px}
.editing{box-shadow:0 0 0 3px var(--ring);border-color:var(--brand)}
.del{background:none;border:0;color:#B3261E;font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:10px 0 0;text-align:left}
.del:hover{text-decoration:underline}

/* forms (edit tab) */
#editor,#lock{max-width:760px;margin-left:auto;margin-right:auto}
#editor{margin-top:28px}
#editList .card{margin-bottom:14px}
h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0 0 14px}
label{display:block;font-size:13.5px;font-weight:700;margin:14px 0 6px}
input[type=text],input[type=url],input[type=password],textarea{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--ring)}
textarea{resize:vertical;min-height:84px}
input[type=file]{font:inherit;font-size:14px}
.preview{width:120px;height:120px;object-fit:contain;border:1.5px dashed var(--line);border-radius:12px;margin-top:8px;display:none;background:#fff}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.ck{display:flex!important;align-items:center;gap:10px;font-weight:600!important;margin:0!important;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-size:14px!important;background:#fff}
.ck:has(input:checked){border-color:var(--brand);background:var(--tint)}
.ck input{margin:0;width:16px;height:16px;accent-color:var(--brand);flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.msg{font-size:13.5px;color:#0B7A5A;margin-top:10px;min-height:18px}
footer{text-align:center;color:var(--mute);font-size:13px;padding:40px 16px 0}
footer img{display:block;height:48px;margin:0 auto 10px}

@media(max-width:640px){
  header{flex-wrap:wrap;gap:10px 12px;padding:10px 16px}
  .badge{display:none}
  .sbar{order:3;flex-basis:100%;max-width:none;margin-left:0}
  .sub{margin-left:auto}
  main{padding:0 14px 40px}
  .hero{padding:18px 16px 14px;border-radius:16px;margin-top:12px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .body{padding:10px 12px 12px}
  .price{font-size:15px}
  .card{border-radius:16px}
  .card h3{font-size:14px}
  .card p,.dom{display:none}
  .btn{padding:10px 8px;font-size:13.5px;white-space:nowrap}
  .pills{gap:8px}
  .pill{padding:6px 12px;font-size:13px}
  .gl{width:40px;font-size:12px}
  .hero p{font-size:14px}
}
@media(max-width:640px){.rbar .sortw{display:none}.card[data-t="dress"] .body{padding:10px 2px 0}}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

  function heroHtml(){
    var used={};data.items.forEach(function(it){(it.cats||[]).forEach(function(c){used[c]=1})});
    var pr=CATS.filter(function(c){return used[c]}).map(function(c){return [c,c]});
    if(st.c&&!used[st.c])st.c="";
    return grp("t","Show",[["gift","Gifts"],["dress","Dresses"]],st.t,"")+grp("s","Store",[["amazon","Amazon"],["meesho","Meesho"]],st.s,"All stores")+(pr.length?grp("c","Price",pr,st.c,"All prices"):"");
  }
  function applyState(){
    document.body.setAttribute("data-store",st.s);
    $("hTitle").textContent=HERO[st.t][0];$("hSub").textContent=HERO[st.t][1];
  }
  function filt(){
    var q=$("q").value.trim().toLowerCase(),c=document.querySelectorAll("#list .card"),n=0,so=$("sort").value;
    $("hSub").textContent=q?"Search results from Gifts and Dresses.":HERO[st.t][1];
    c.forEach(function(x,i){var m=(!q||x.getAttribute("data-s").indexOf(q)>-1)&&(q||x.getAttribute("data-t")===st.t)&&(!st.s||x.getAttribute("data-st")===st.s)&&(!st.c||x.getAttribute("data-c").indexOf("|"+st.c+"|")>-1);x.style.display=m?"":"none";if(m)n++;var r=+x.getAttribute("data-r");x.style.order=so==="new"?-i:so==="lo"?r*1000+i:so==="hi"?(r===99?99:10-r)*1000+i:i});
    $("none").className=(c.length&&!n)?"box empty":"box empty hide";
  }
  $("sort").onchange=filt;
  $("q").oninput=filt;$("go").onclick=filt;
  function render(){
    document.title=data.title||"My Links";
    $("catWrap").innerHTML=heroHtml();applyState();
    $("list").innerHTML=cardsHtml(false);$("editList").innerHTML=cardsHtml(true);filt();
  }
  $("catWrap").onclick=function(e){
    var b=e.target.closest?e.target.closest(".pill"):null;if(!b)return;
    var g=b.getAttribute("data-g");st[g]=b.getAttribute("data-v");
    [].forEach.call($("catWrap").querySelectorAll('.pill[data-g="'+g+'"]'),function(x){x.className=x===b?"pill on":"pill"});
    applyState();filt();
  };
  // Script placed inside the downloaded public page (same filtering, no editor)
  function pageScript(HERO,NOUN){
    var g=function(i){return document.getElementById(i)},st={t:"gift",s:"",c:""};
    function f(){var q=g("q").value.trim().toLowerCase(),c=document.querySelectorAll("#list .card"),n=0,so=g("sort").value;g("hSub").textContent=q?"Search results from Gifts and Dresses.":HERO[st.t][1];c.forEach(function(x,i){var m=(!q||x.getAttribute("data-s").indexOf(q)>-1)&&(q||x.getAttribute("data-t")===st.t)&&(!st.s||x.getAttribute("data-st")===st.s)&&(!st.c||x.getAttribute("data-c").indexOf("|"+st.c+"|")>-1);x.style.display=m?"":"none";if(m)n++;var r=+x.getAttribute("data-r");x.style.order=so==="new"?-i:so==="lo"?r*1000+i:so==="hi"?(r===99?99:10-r)*1000+i:i});g("none").className=(c.length&&!n)?"box empty":"box empty hide"}
    function a(){document.body.setAttribute("data-store",st.s);g("hTitle").textContent=HERO[st.t][0];g("hSub").textContent=HERO[st.t][1]}
    g("q").oninput=f;g("go").onclick=f;g("sort").onchange=f;
    var w=g("catWrap");
    w.onclick=function(e){var b=e.target.closest(".pill");if(!b)return;var k=b.getAttribute("data-g");st[k]=b.getAttribute("data-v");[].forEach.call(w.querySelectorAll('.pill[data-g="'+k+'"]'),function(x){x.className=x===b?"pill on":"pill"});a();f()};
    a();f();
  }
  $("catBox").innerHTML=CATS.map(function(c){return '<label class="ck"><input type="checkbox" value="'+esc(c)+'"> '+esc(c)+'</label>'}).join("");


  // Shrink uploaded image so it fits in browser storage
  $("img").onchange=function(){
    var f=this.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var m=500,sc=Math.min(1,m/Math.max(im.width,im.height));
        var c=document.createElement("canvas");
        c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
        var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);
        x.drawImage(im,0,0,c.width,c.height);
        imgData=c.toDataURL("image/jpeg",0.8);
        $("preview").src=imgData;$("preview").style.display="block";
      };
      im.src=r.result;
    };
    r.readAsDataURL(f);
  };

  var editIdx=-1;
  function pick(name,val){[].forEach.call(document.querySelectorAll("input[name="+name+"]"),function(r){r.checked=r.value===val})}
  function resetForm(){
    editIdx=-1;
    $("name").value=$("url").value=$("desc").value=$("code").value="";$("img").value="";
    [].forEach.call(document.querySelectorAll("#catBox input"),function(b){b.checked=false});
    imgData="";$("preview").style.display="none";
    $("formTitle").textContent="Add a product";$("add").textContent="Add product";$("cancel").className="btn alt hide";
    $("formBox").className="box";
    [].forEach.call(document.querySelectorAll("#editList .card"),function(c){c.classList.remove("editing")});
  }
  $("add").onclick=function(){
    var name=$("name").value.trim(),url=$("url").value.trim();
    if(!name||!url){$("msg").style.color="#B12704";$("msg").textContent="Enter a product name and a link.";return}
    var cats=[].slice.call(document.querySelectorAll("#catBox input:checked")).map(function(b){return b.value});
    var item={img:imgData,code:$("code").value.trim(),name:name,url:fixUrl(url),desc:$("desc").value.trim(),cats:cats,theme:document.querySelector("input[name=theme]:checked").value,store:document.querySelector("input[name=store]:checked").value};
    var editing=editIdx>-1&&data.items[editIdx];
    if(editing)data.items[editIdx]=item;else data.items.push(item);
    save();
    if(!autoSave())note(editing?"Product updated.":"Product added.");
    resetForm();
    render();
  };
  $("cancel").onclick=function(){resetForm();$("msg").textContent=""};

  $("editList").onclick=function(e){
    var t=e.target,ei=t.getAttribute("data-e"),i=t.getAttribute("data-i");
    if(ei!==null){
      var it=data.items[+ei];if(!it)return;
      resetForm();editIdx=+ei;
      $("name").value=it.name||"";$("code").value=it.code||"";$("url").value=it.url||"";$("desc").value=it.desc||"";
      pick("theme",it.theme||"gift");pick("store",it.store||"amazon");
      [].forEach.call(document.querySelectorAll("#catBox input"),function(b){b.checked=(it.cats||[]).indexOf(b.value)>-1});
      imgData=it.img||"";
      if(imgData){$("preview").src=imgData;$("preview").style.display="block"}
      $("formTitle").innerHTML='Edit product<small>Change anything, then save</small>';$("add").textContent="Save changes";$("cancel").className="btn alt";
      $("formBox").className="box editing";
      $("msg").textContent="";
      $("formBox").scrollIntoView({behavior:"smooth",block:"start"});
      return;
    }
    if(i===null)return;
    if(!confirm("Delete this product permanently?"))return;
    if(editIdx>-1)resetForm();
    data.items.splice(+i,1);save();render();
    if(!autoSave())note("Product deleted.");
  };

  // Save everything (links + editor) back into this file
  var fh=null;
  function build(){
    var seed={v:Date.now(),title:data.title||"My Links",bio:data.bio||"",items:data.items};
    var json=JSON.stringify(seed).replace(/</g,"\\u003c");
    SEED.v=seed.v;
    return TEMPLATE.replace(/(<script id="seed" type="application\/json">)[\s\S]*?(<\/script>)/,function(m,p1,p2){return p1+json+p2});
  }
  function done(t){try{localStorage.removeItem(DKEY)}catch(e){}dirty=false;$("msg").style.color="#067D62";$("msg").textContent=t}
  function writeFile(){
    var out=build();
    return fh.createWritable().then(function(w){return w.write(out).then(function(){return w.close()})});
  }
  // after the file is chosen once, every add/delete is written straight into it
  function autoSave(){
    if(!fh)return false;
    writeFile().then(function(){done("Saved into the file ("+size()+" of links). Share this file and everyone sees the same links.")})
      .catch(function(){fh=null;note("Could not write to the file.")});
    return true;
  }
  $("saveFile").onclick=function(){
    if(window.showSaveFilePicker){
      window.showSaveFilePicker({suggestedName:"index.html",types:[{description:"HTML file",accept:{"text/html":[".html"]}}]})
        .then(function(h){fh=h;return writeFile()})
        .then(function(){done("Saved into the file. From now on every change is written to it automatically.")})
        .catch(function(){});
      return;
    }
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([build()],{type:"text/html"}));
    a.download="index.html";a.click();
    done("Saved index.html. Replace the old file with it. Share that file and everyone sees the same links.");
  };

  // Download a clean page (no editor) that you can host anywhere
  $("export").onclick=function(){
    var css=document.querySelector("style").textContent;
    var html='<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>'+esc(data.title||"My Links")+'</title>'+
      '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">'+
      '<style>'+css+'</style></head><body>'+
      document.querySelector("header").outerHTML.replace(/<nav class="sub">.*?<\/nav>/,"")+
      '<main><div class="hero"><h1 id="hTitle"></h1><p id="hSub"></p><div id="catWrap">'+heroHtml()+'</div></div>'+document.querySelector(".rbar").outerHTML+'<div id="list" class="grid">'+cardsHtml(false)+'</div><div id="none" class="box empty hide">Nothing here yet. Try another store, price range or search word.</div>'+
      document.querySelector("footer").outerHTML+'</main>'+
      '<scr'+'ipt>('+pageScript.toString()+')('+JSON.stringify(HERO)+','+JSON.stringify(NOUN)+')</scr'+'ipt></body></html>';
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));
    a.download="index.html";a.click();
    $("msg").style.color="#067D62";$("msg").textContent="Downloaded index.html. Upload it to a free host to get your link.";
  };

  var PASS="3415",unlocked=false;
  function show(tab){
    var home=tab==="home",edit=tab==="edit"&&unlocked,lock=tab==="edit"&&!unlocked;
    $("home").className=home?"":"hide";
    $("editor").className=edit?"":"hide";
    $("lock").className=lock?"box":"box hide";
    $("tabHome").className=home?"on":"";$("tabEdit").className=home?"":"on";
    $("sbar").style.display=home?"":"none";
    if(lock){$("pw").value="";$("lockMsg").textContent="";$("pw").focus()}
    window.scrollTo(0,0);
  }
  function tryUnlock(){
    if($("pw").value===PASS){unlocked=true;show("edit")}
    else{$("lockMsg").textContent="Wrong password. Try again.";$("pw").value=""}
  }
  $("unlock").onclick=tryUnlock;
  $("pw").onkeydown=function(e){if(e.key==="Enter")tryUnlock()};
  $("tabHome").onclick=function(){show("home")};
  $("tabEdit").onclick=function(){show("edit")};

  render();
  // Edit tab is hidden. Press Ctrl+Alt+M to show or hide it.
  var editTab=$("tabEdit");
  editTab.style.display="none";
  document.addEventListener("keydown",function(e){
    if(e.ctrlKey&&e.altKey&&e.code==="KeyM"){
      e.preventDefault();
      var hidden=editTab.style.display==="none";
      editTab.style.display=hidden?"":"none";
      if(hidden){show("edit")}
      else{unlocked=false;show("home")}
    }
  });
  show("home");
})();
</script></body></html>
