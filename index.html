<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Links</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Amazon Ember",Arial,Helvetica,sans-serif;background:#EAEDED;color:#0F1111}
header{background:#131921;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header b{font-size:22px}
header span{color:#FF9900;font-size:22px;font-weight:700}
.sub{background:#232F3E;color:#fff;padding:0 16px;font-size:14px;display:flex;gap:4px}
.sub button,.sub span{background:none;border:0;color:#fff;font:inherit;padding:10px 12px;cursor:pointer;border-bottom:3px solid transparent}
.sub button.on,.sub span{border-bottom-color:#FF9900;font-weight:700}
.sub button:hover{border-bottom-color:#FEBD69}
.hero{background:linear-gradient(#37475A,#EAEDED);margin:0 -16px 16px;padding:28px 16px 36px;text-align:center;color:#fff}
.hero h1{font-size:28px;font-weight:700;margin:0 0 6px}
.hero div{font-size:15px;color:#E3E6E6}
.hide{display:none}
main{max-width:720px;margin:0 auto;padding:16px}
.box{background:#fff;border:1px solid #D5D9D9;border-radius:8px;padding:16px;margin-bottom:16px}
h1{font-size:24px;font-weight:400;margin:0 0 4px}
h2{font-size:18px;font-weight:700;margin:0 0 12px}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
input[type=text],input[type=url],textarea{width:100%;padding:8px;border:1px solid #888C8C;border-radius:4px;font:inherit;font-size:14px}
input:focus,textarea:focus{outline:none;border-color:#E77600;box-shadow:0 0 0 3px #C8F3FA}
textarea{resize:vertical;min-height:70px}
.btn{display:inline-block;background:#FFD814;border:1px solid #FCD200;border-radius:20px;padding:8px 18px;font:inherit;font-size:14px;color:#0F1111;cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{background:#F7CA00}
.btn:focus-visible,.link:focus-visible{outline:3px solid #007185;outline-offset:2px}
.btn.alt{background:#fff;border-color:#D5D9D9}
.btn.alt:hover{background:#F7FAFA}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.preview{width:110px;height:110px;object-fit:contain;border:1px dashed #D5D9D9;border-radius:4px;margin-top:6px;display:none;background:#fff}
.card{display:flex;gap:16px;background:#fff;border:1px solid #D5D9D9;border-radius:8px;padding:14px;margin-bottom:12px}
.card img{width:130px;height:130px;object-fit:contain;flex:none}
.card h3{margin:0 0 4px;font-size:17px;font-weight:500;line-height:1.3}
.card h3 a{color:#007185;text-decoration:none}
.card h3 a:hover{color:#C7511F;text-decoration:underline}
.card p{margin:0 0 10px;font-size:14px;color:#565959;line-height:1.4;white-space:pre-line}
.del{background:none;border:0;color:#007185;font:inherit;font-size:13px;cursor:pointer;margin-left:10px}
.del:hover{color:#C7511F;text-decoration:underline}
.empty{text-align:center;color:#565959;padding:24px 0}
.msg{font-size:13px;color:#067D62;margin-top:8px;min-height:18px}
@media(max-width:480px){.card{flex-direction:column;align-items:center;text-align:center}.card img{width:100%;height:180px}}

/* polish */
body{background:#E3E6E6}
header{box-shadow:0 2px 4px rgba(0,0,0,.25);padding:14px 20px}
header b{font-size:24px;letter-spacing:.2px}
main{max-width:760px;padding:0 16px 40px}
.hero{background:linear-gradient(180deg,#232F3E 0%,#37475A 70%,#E3E6E6 100%);margin:0 -16px 20px;padding:36px 16px 56px}
.hero h1{font-size:32px;line-height:1.15}
.hero div{font-size:16px;max-width:480px;margin:0 auto}
.hero small{display:inline-block;margin-top:14px;background:#FF9900;color:#131921;font-weight:700;font-size:13px;padding:5px 14px;border-radius:14px}
.card{gap:18px;padding:16px;border-radius:10px;box-shadow:0 1px 3px rgba(15,17,17,.13);transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 4px 14px rgba(15,17,17,.2);transform:translateY(-2px)}
.card img{width:140px;height:140px;background:#F7F8F8;border-radius:8px;padding:6px}
.card>div{flex:1;min-width:0}
.card h3{font-size:19px}
.dom{font-size:12px;color:#565959;margin:0 0 8px}
.card .btn{font-weight:500;padding:9px 26px;box-shadow:0 2px 5px rgba(213,217,217,.5)}
footer{text-align:center;color:#565959;font-size:12px;padding:8px 16px 28px}
@media(max-width:480px){.hero h1{font-size:26px}.card .btn{display:block}.card img{height:200px;width:100%}}

.sbar{display:flex;flex:1;max-width:560px}
.sbar input{flex:1;min-width:0;border:0;border-radius:6px 0 0 6px;padding:10px 12px;font:inherit;font-size:15px}
.sbar input:focus{outline:3px solid #FF9900;outline-offset:-3px;box-shadow:none}
.sbtn{background:#FEBD69;border:0;border-radius:0 6px 6px 0;width:46px;cursor:pointer}
.sbtn:hover{background:#F3A847}
.code{font-size:13px;color:#565959;margin:0 0 6px}
.code b{color:#0F1111;font-weight:700}
@media(max-width:560px){header{flex-wrap:wrap}.sbar{order:3;flex-basis:100%;max-width:none}}

main{padding-top:20px}

/* header shopping background */
header{position:relative;overflow:hidden;min-height:64px;background:linear-gradient(90deg,#131921,#1F2B3A 55%,#2C3B4E)}
header>*{position:relative}
header>.hbg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
header b{text-shadow:0 1px 6px #000}
.imglink{flex:none;display:block}
@media(max-width:480px){.imglink{width:100%}}

  function filt(){
    var q=$("q").value.trim().toLowerCase(),cs=$("catSel"),cv=cs?cs.value:"",c=document.querySelectorAll("#list .card"),n=0;
    c.forEach(function(x){var m=(!q||x.getAttribute("data-s").indexOf(q)>-1)&&(!cv||x.getAttribute("data-c").indexOf("|"+cv+"|")>-1);x.style.display=m?"":"none";if(m)n++});
    $("none").className=(c.length&&!n)?"box empty":"box empty hide";
  }
  $("q").oninput=filt;$("go").onclick=filt;
  function render(){
    document.title=data.title||"My Links";
    var cur=$("catSel")?$("catSel").value:"";
    $("catWrap").innerHTML=catBarHtml();
    if($("catSel")){$("catSel").value=cur;if($("catSel").value!==cur)$("catSel").value=""}
    $("list").innerHTML=cardsHtml(false);$("editList").innerHTML=cardsHtml(true);filt();
  }
  $("catWrap").onchange=filt;
  $("catBox").innerHTML=CATS.map(function(c){return '<label class="ck"><input type="checkbox" value="'+esc(c)+'"> '+esc(c)+'</label>'}).join("");


  // Shrink uploaded image so it fits in browser storage
  $("img").onchange=function(){
    var f=this.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var m=500,sc=Math.min(1,m/Math.max(im.width,im.height));
        var c=document.createElement("canvas");
        c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
        var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);
        x.drawImage(im,0,0,c.width,c.height);
        imgData=c.toDataURL("image/jpeg",0.8);
        $("preview").src=imgData;$("preview").style.display="block";
      };
      im.src=r.result;
    };
    r.readAsDataURL(f);
  };

  $("add").onclick=function(){
    var name=$("name").value.trim(),url=$("url").value.trim();
    if(!name||!url){$("msg").style.color="#B12704";$("msg").textContent="Enter a product name and a link.";return}
    var cats=[].slice.call(document.querySelectorAll("#catBox input:checked")).map(function(b){return b.value});
    data.items.push({img:imgData,code:$("code").value.trim(),name:name,url:fixUrl(url),desc:$("desc").value.trim(),cats:cats});
    save();
    if(!autoSave())note("Link added.");
    $("name").value=$("url").value=$("desc").value=$("code").value="";$("img").value="";
    [].forEach.call(document.querySelectorAll("#catBox input"),function(b){b.checked=false});
    imgData="";$("preview").style.display="none";
    render();
  };

  $("editList").onclick=function(e){
    var i=e.target.getAttribute("data-i");
    if(i===null)return;
    if(!confirm("Delete this link permanently?"))return;
    data.items.splice(+i,1);save();render();
    if(!autoSave())note("Link deleted.");
  };

  // Save everything (links + editor) back into this file
  var fh=null;
  function build(){
    var seed={v:Date.now(),title:data.title||"My Links",bio:data.bio||"",items:data.items};
    var json=JSON.stringify(seed).replace(/</g,"\\u003c");
    SEED.v=seed.v;
    return TEMPLATE.replace(/(<script id="seed" type="application\/json">)[\s\S]*?(<\/script>)/,function(m,p1,p2){return p1+json+p2});
  }
  function done(t){try{localStorage.removeItem(DKEY)}catch(e){}dirty=false;$("msg").style.color="#067D62";$("msg").textContent=t}
  function writeFile(){
    var out=build();
    return fh.createWritable().then(function(w){return w.write(out).then(function(){return w.close()})});
  }
  // after the file is chosen once, every add/delete is written straight into it
  function autoSave(){
    if(!fh)return false;
    writeFile().then(function(){done("Saved into the file ("+size()+" of links). Share this file and everyone sees the same links.")})
      .catch(function(){fh=null;note("Could not write to the file.")});
    return true;
  }
  $("saveFile").onclick=function(){
    if(window.showSaveFilePicker){
      window.showSaveFilePicker({suggestedName:"index.html",types:[{description:"HTML file",accept:{"text/html":[".html"]}}]})
        .then(function(h){fh=h;return writeFile()})
        .then(function(){done("Saved into the file. From now on every change is written to it automatically.")})
        .catch(function(){});
      return;
    }
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([build()],{type:"text/html"}));
    a.download="index.html";a.click();
    done("Saved index.html. Replace the old file with it. Share that file and everyone sees the same links.");
  };

  // Download a clean page (no editor) that you can host anywhere
  $("export").onclick=function(){
    var css=document.querySelector("style").textContent;
    var html='<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>'+esc(data.title||"My Links")+'</title><style>'+css+'</style></head><body>'+
      '<header><b>my<span>links</span></b><div class="sbar" id="sbar"><input type="search" id="q" placeholder="Search by name, item or code" aria-label="Search links"><button class="sbtn" id="go" aria-label="Search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#131921" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button></div></header><nav class="sub"><span>Home</span></nav><main>'+
      '<div id="catWrap">'+catBarHtml()+'</div><div id="list">'+cardsHtml(false)+'</div><div id="none" class="box empty hide">No links match your search.</div><footer>Thanks for visiting</footer></main>'+
      '<scr'+'ipt>(function(){var g=function(i){return document.getElementById(i)};function f(){var q=g("q").value.trim().toLowerCase(),cs=g("catSel"),cv=cs?cs.value:"",c=document.querySelectorAll("#list .card"),n=0;c.forEach(function(x){var m=(!q||x.getAttribute("data-s").indexOf(q)>-1)&&(!cv||x.getAttribute("data-c").indexOf("|"+cv+"|")>-1);x.style.display=m?"":"none";if(m)n++});g("none").className=(c.length&&!n)?"box empty":"box empty hide"}g("q").oninput=f;g("go").onclick=f;g("catWrap").onchange=f})()</scr'+'ipt></body></html>';
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));
    a.download="index.html";a.click();
    $("msg").style.color="#067D62";$("msg").textContent="Downloaded index.html. Upload it to a free host to get your link.";
  };

  var PASS="3415",unlocked=false;
  function show(tab){
    var home=tab==="home",edit=tab==="edit"&&unlocked,lock=tab==="edit"&&!unlocked;
    $("home").className=home?"":"hide";
    $("editor").className=edit?"":"hide";
    $("lock").className=lock?"box":"box hide";
    $("tabHome").className=home?"on":"";$("tabEdit").className=home?"":"on";
    $("sbar").style.display=home?"":"none";
    if(lock){$("pw").value="";$("lockMsg").textContent="";$("pw").focus()}
    window.scrollTo(0,0);
  }
  function tryUnlock(){
    if($("pw").value===PASS){unlocked=true;show("edit")}
    else{$("lockMsg").textContent="Wrong password. Try again.";$("pw").value=""}
  }
  $("unlock").onclick=tryUnlock;
  $("pw").onkeydown=function(e){if(e.key==="Enter")tryUnlock()};
  $("tabHome").onclick=function(){show("home")};
  $("tabEdit").onclick=function(){show("edit")};

  render();
  // Edit tab is hidden. Press Ctrl+Alt+M to show or hide it.
  var editTab=$("tabEdit");
  editTab.style.display="none";
  document.addEventListener("keydown",function(e){
    if(e.ctrlKey&&e.altKey&&e.code==="KeyM"){
      e.preventDefault();
      var hidden=editTab.style.display==="none";
      editTab.style.display=hidden?"":"none";
      if(hidden){show("edit")}
      else{unlocked=false;show("home")}
    }
  });
  show("home");
})();
</script></body></html>
